# Start everything:   docker compose up --build
# Open the app:       http://localhost:3000   (API: http://localhost:8080)
# Run backend tests:  docker compose --profile test run --rm backend-tests
# Run frontend tests: docker compose --profile test run --rm frontend-tests

services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_admission
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives `docker compose down` / restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---- only started with --profile test ----
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DB_CONNECTION: "Host=db;Port=5432;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "test"]

volumes:
  pgdata:
